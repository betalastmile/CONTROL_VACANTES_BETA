<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reporte de Vacantes</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
        <style>
            /* --- Tema claro: sobreescribe los colores oscuros cuando body tiene .light-theme --- */
            body.light-theme { background-color: #f3f4f6 !important; }
            body.light-theme .bg-\[\#0a0a0a\] { background-color: #ffffff !important; }
            body.light-theme .bg-\[\#0f0f0f\] { background-color: #ffffff !important; }
            body.light-theme .bg-\[\#1a1a1a\] { background-color: #ffffff !important; }
            body.light-theme .bg-\[\#151515\] { background-color: #f3f4f6 !important; }
            body.light-theme .bg-\[\#252525\] { background-color: #f3f4f6 !important; }
            body.light-theme .border-gray-700 { border-color: #d1d5db !important; }
            body.light-theme .border-gray-800 { border-color: #e5e7eb !important; }
            body.light-theme .text-white { color: #111827 !important; }
            body.light-theme .text-gray-300 { color: #374151 !important; }
            body.light-theme .text-gray-400 { color: #6b7280 !important; }
            body.light-theme .text-gray-500 { color: #6b7280 !important; }
            body.light-theme .placeholder-gray-500::placeholder { color: #9ca3af !important; }
            body.light-theme .hover\:bg-gray-900:hover { background-color: #f3f4f6 !important; }
            body.light-theme .hover\:bg-gray-600:hover { background-color: #d1d5db !important; }
            body.light-theme .hover\:bg-\[\#252525\]:hover { background-color: #f3f4f6 !important; }
            body.light-theme .bg-gray-700 { background-color: #e5e7eb !important; color: #111827 !important; }
            body.light-theme .cursor-not-allowed.bg-\[\#151515\] { color: #6b7280 !important; }

            /* --- Animaciones de la pantalla de login (verde corporativo, como el logo) --- */
            :root { --brand-green: #8CC63F; --brand-green-dark: #6EA82D; }
            @keyframes loginCardIn {
                0% { opacity: 0; transform: translateY(24px) scale(0.96); }
                100% { opacity: 1; transform: translateY(0) scale(1); }
            }
            @keyframes loginFieldIn {
                0% { opacity: 0; transform: translateY(10px); }
                100% { opacity: 1; transform: translateY(0); }
            }
            @keyframes loginIconPulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.08); }
            }
            @keyframes loginGlow {
                0%, 100% { box-shadow: 0 0 0 rgba(140, 198, 63, 0); }
                50% { box-shadow: 0 0 30px rgba(140, 198, 63, 0.28); }
            }
            .login-card {
                position: relative;
                z-index: 10;
                animation: loginCardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both, loginGlow 3.5s ease-in-out 0.6s infinite;
            }
            .login-icon {
                animation: loginIconPulse 2.2s ease-in-out infinite;
            }
            .login-field-1 { animation: loginFieldIn 0.45s ease-out 0.15s both; }
            .login-field-2 { animation: loginFieldIn 0.45s ease-out 0.25s both; }
            .login-field-3 { animation: loginFieldIn 0.45s ease-out 0.35s both; }
            .login-field-4 { animation: loginFieldIn 0.45s ease-out 0.45s both; }
            .login-input:focus {
                outline: none;
                border-color: var(--brand-green) !important;
                box-shadow: 0 0 0 2px rgba(140, 198, 63, 0.35);
            }
            #loginParticles {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 0;
            }
            @media (prefers-reduced-motion: reduce) {
                .login-card, .login-icon, .login-field-1, .login-field-2, .login-field-3, .login-field-4 { animation: none !important; }
                #loginParticles { display: none; }
            }

            /* --- Impresión / Exportar a PDF (usa el diálogo de impresión del navegador) --- */
            @media print {
                @page { size: landscape; margin: 12mm; }
                body { background: #ffffff !important; }
                .no-imprimir { display: none !important; }
                #app { padding: 0 !important; }
                /* Fuerza fondo claro y texto oscuro al imprimir, sin importar el tema activo */
                [class*="bg-[#"] { background-color: #ffffff !important; }
                .border-gray-700, .border-gray-800 { border-color: #d1d5db !important; }
                .text-white { color: #111827 !important; }
                .text-gray-300, .text-gray-400, .text-gray-500 { color: #4b5563 !important; }
                .shadow-lg { box-shadow: none !important; }
                canvas { max-width: 100% !important; }
                /* Evita que una tarjeta o gráfica se corte entre dos páginas */
                .rounded-lg.border, .rounded-lg.shadow-lg { break-inside: avoid; page-break-inside: avoid; }
            }
        </style>
    </head>
    <body class="bg-[#0a0a0a]">
        <div id="app" class="p-6 min-h-screen"></div>

        <script>
            const icons = {
                search: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>',
                download: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>',
                filter: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>',
                plus: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
                x: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
                edit: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>',
                sun: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>',
                moon: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>',
                lock: '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>',
                eye: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>',
                eyeOff: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>',
                refresh: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>',
                alertTriangle: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>'
            };

            // Las vacantes ya no se cargan de ejemplo: se obtienen en vivo desde
            // el Google Sheet (REGISTRO VACANTES) al iniciar sesión.
            const mockData = [];

            /* IMPORTANTE: reemplaza esta URL por la URL de despliegue (Web App) de tu
            Apps Script conectado al Google Sheet. Debe ser la MISMA URL que se
            configura en CRM_2.html (NOTIF_APPS_SCRIPT_URL) para que ambos
            sistemas lean/escriban en la misma hoja. */
            const NOTIF_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwdNSmaav4mqChHH3sCU1Na5InyPhdWpu2CL1Gc2F6-Zg04asVUmNMoZfF278rZfDIx/exec';

            function enviarWhatsAppVacante(v) {
                const mensaje = `📋 *Nueva Vacante Cargada*\n\n` +
                    `Folio: ${v.id}\n` +
                    `Vacante: ${v.vacante || ''}\n` +
                    `Gerente/Director: ${v.gerenteDirector}\n` +
                    `Cliente: ${v.cliente}\n` +
                    `Motivo de la vacante: ${v.motivoVacante || ''}\n` +
                    `Ciudad: ${v.ciudad}\n` +
                    `Sucursal: ${v.sucursal}\n` +
                    `Dirección de tienda: ${v.direccionTienda || ''}\n` +
                    `Formato: ${v.formato}\n` +
                    `Prioridad: ${v.prioridad}\n` +
                    `Estatus: ${v.estatusVacante}\n` +
                    `Fecha de solicitud: ${v.fechaSolicitud}\n` +
                    `Fecha de vencimiento: ${v.fechaVencimiento}\n` +
                    `Observaciones Adicionales: ${v.requerimiento}`;
                // Se abre WhatsApp sin número predefinido para que el usuario elija a quién enviarlo
                window.open(`https://wa.me/?text=${encodeURIComponent(mensaje)}`, '_blank');
            }

            // Arma el texto del mensaje de reapertura (sin abrir ninguna ventana),
            // para poder reutilizarlo tanto al abrir la pestaña de WhatsApp de
            // inmediato como al redirigirla después de confirmar en el backend.
            function armarMensajeReapertura(v, motivo, detalle) {
                return `🔄 *Vacante Reaperturada*\n\n` +
                    `Folio: ${v.id}\n` +
                    `Vacante: ${v.vacante || ''}\n` +
                    `Gerente/Director: ${v.gerenteDirector}\n` +
                    `Cliente: ${v.cliente}\n` +
                    `Ciudad: ${v.ciudad}\n` +
                    `Sucursal: ${v.sucursal}\n` +
                    `Estatus anterior: ${v.estatusVacante}\n` +
                    `Estatus actual: VIGENTE-REAPERTURADO\n` +
                    `Motivo de la reapertura: ${motivo}\n` +
                    (detalle ? `Detalles: ${detalle}\n` : '') +
                    `Reabierta por: ${state.currentUser ? state.currentUser.nombre : ''}`;
            }

            // Arma y abre el mensaje de WhatsApp cuando se reabre una vacante,
            // avisando el folio y el motivo. Igual que enviarWhatsAppVacante, no
            // fija un número: el usuario elige a quién enviarlo.
            // OJO: esta función solo funciona si se llama de forma SÍNCRONA,
            // dentro del mismo clic del usuario (sin await antes). Si necesitas
            // esperar una respuesta del backend primero, usa el patrón de
            // "ventana pre-abierta" que se usa en confirmarReapertura().
            function enviarWhatsAppReapertura(v, motivo, detalle) {
                window.open(`https://wa.me/?text=${encodeURIComponent(armarMensajeReapertura(v, motivo, detalle))}`, '_blank');
            }

            // Arma el texto del mensaje de cancelación (sin abrir ninguna
            // ventana), igual que armarMensajeReapertura, para reutilizarlo
            // tanto de forma inmediata como al redirigir después de confirmar
            // en el backend.
            function armarMensajeCancelacion(v, motivo) {
                return `❌ *Vacante Cancelada*\n\n` +
                    `Folio: ${v.id}\n` +
                    `Vacante: ${v.vacante || ''}\n` +
                    `Gerente/Director: ${v.gerenteDirector}\n` +
                    `Cliente: ${v.cliente}\n` +
                    `Ciudad: ${v.ciudad}\n` +
                    `Sucursal: ${v.sucursal}\n` +
                    `Estatus anterior: ${v.estatusVacante}\n` +
                    `Estatus actual: CANCELADA\n` +
                    `Motivo de la cancelación: ${motivo}\n` +
                    `Cancelada por: ${state.currentUser ? state.currentUser.nombre : ''}`;
            }

            // Arma y abre el mensaje de WhatsApp cuando se cancela una vacante,
            // avisando el folio y el motivo. Igual que enviarWhatsAppReapertura,
            // no fija un número: el usuario elige a quién enviarlo. OJO: esta
            // función solo funciona si se llama de forma SÍNCRONA, dentro del
            // mismo clic del usuario (ver el patrón de "ventana pre-abierta" en
            // confirmarCancelacion()).
            function enviarWhatsAppCancelacion(v, motivo) {
                window.open(`https://wa.me/?text=${encodeURIComponent(armarMensajeCancelacion(v, motivo))}`, '_blank');
            }

            function notificarCRM2Vacante(v) {
                fetch(NOTIF_APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        accion: 'nueva_vacante',
                        id: v.id,
                        requerimiento: v.requerimiento,
                        vacante: v.vacante || '',
                        gerenteDirector: v.gerenteDirector,
                        idTienda: v.idTienda,
                        estado: v.estado,
                        cliente: v.cliente,
                        ciudad: v.ciudad,
                        proyecto: v.proyecto,
                        motivoVacante: v.motivoVacante || '',
                        sucursal: v.sucursal,
                        direccionTienda: v.direccionTienda || '',
                        formato: v.formato,
                        prioridad: v.prioridad,
                        estatusVacante: v.estatusVacante,
                        fechaSolicitud: v.fechaSolicitud,
                        fechaVencimiento: v.fechaVencimiento,
                        fechaCubierta: v.fechaCubierta || '',
                        usuarioCarga: v.usuarioCarga || '',
                        nombreCarga: v.nombreCarga || '',
                        fechaNotificacion: new Date().toISOString()
                    })
                }).catch(err => console.error('Error al notificar al CRM2:', err));
            }

            // Estatus desde los cuales SÍ se permite reabrir una vacante.
            const ESTATUS_REAPERTURABLES = ['CUBIERTA', 'FORMALIZADO'];

            // Pide al backend (Code.gs) que reabra la vacante: busca el folio en la
            // hoja REGISTRO VACANTES, valida el estatus actual otra vez del lado del
            // servidor (por seguridad) y, si aplica, cambia el estatus y guarda el
            // motivo de reapertura.
            async function reabrirVacanteEnSheet(id, motivoReapertura, detalleReapertura) {
                const res = await fetch(NOTIF_APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        accion: 'reabrir_vacante',
                        id,
                        motivoReapertura,
                        detalleReapertura: detalleReapertura || '',
                        usuario: state.currentUser ? state.currentUser.usuario : '',
                        nombreUsuario: state.currentUser ? state.currentUser.nombre : ''
                    })
                });
                return res.json();
            }

            // Estatus desde los cuales SÍ se permite cancelar una vacante.
            // Solo se puede cancelar cuando está VIGENTE. Una vez CANCELADA, no
            // puede volver a cancelarse ni reabrirse (CANCELADA no está en
            // ESTATUS_REAPERTURABLES).
            const ESTATUS_CANCELABLES = ['VIGENTE'];

            // Pide al backend (Code.gs) que cancele la vacante: busca el folio en
            // la hoja REGISTRO VACANTES, valida el estatus actual otra vez del
            // lado del servidor (por seguridad) y, si aplica, cambia el estatus a
            // CANCELADA y guarda el motivo de la cancelación.
            async function cancelarVacanteEnSheet(id, motivoCancelacion) {
                const res = await fetch(NOTIF_APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        accion: 'cancelar_vacante',
                        id,
                        motivoCancelacion,
                        usuario: state.currentUser ? state.currentUser.usuario : '',
                        nombreUsuario: state.currentUser ? state.currentUser.nombre : ''
                    })
                });
                return res.json();
            }

            // Instancias de Chart.js del dashboard, para poder destruirlas antes de
            // volver a dibujarlas cada vez que render() reemplaza el HTML (evita
            // fugas de memoria y el error "Canvas is already in use").
            let dashboardCharts = {};
            function destruirGraficasDashboard() {
                Object.values(dashboardCharts).forEach(c => { if (c) c.destroy(); });
                dashboardCharts = {};
            }

            let state = {
                vacancies: [...mockData],
                view: 'vacantes',   // 'vacantes' | 'dashboard'
                dashboardFiltro: null,   // { campo, valor } — filtro cruzado activado al hacer clic en una gráfica del dashboard
                dashboardPeriodo: 'mes',   // 'semana' | 'quincena' | 'mes' — granularidad de las gráficas de tendencia del dashboard
                searchTerm: '',
                filterEstatusVacante: 'Todos',
                filterPrioridad: 'Todas',
                filterGerencia: 'Todas',
                filterCard: 'total',   // 'total' | 'activas' | 'prioridadAlta' | 'cubiertas' | 'reaperturas' | 'canceladas' | 'vencidas' — filtro activo por tarjeta
                showNewVacancyModal: false,
                currentUser: null,      // { usuario, nombre } una vez logueado
                loginError: '',
                loginLoading: false,
                catalogos: { puestos: [], motivos: [], prioridades: [], gerentes: [], motivosReapertura: [] },
                theme: localStorage.getItem('vacantes_theme') || 'dark',

                // --- Banner de vacantes vencidas ---
                vencidas: [],                  // [{ id, dias }] vacantes activas ya vencidas
                bannerVencidasCerrado: false,  // el usuario cerró el banner (se reabre si aparece un folio vencido nuevo)

                // --- Flujo de Reapertura ---
                showReaperturaModal: false,
                reaperturaStep: 'buscar',   // 'buscar' | 'confirmar'
                reaperturaFolio: '',
                reaperturaVacante: null,    // vacante encontrada, si aplica para reabrir
                reaperturaError: '',        // mensaje de error/aviso a mostrar
                reaperturaMotivoCategoria: '',  // Selección del menú "Motivo de Reapertura" (catálogo MOTIVO REAPERTURA)
                reaperturaMotivo: '',  // Texto libre de "Detalles de la reapertura"
                reaperturaLoading: false,

                // --- Flujo de Cancelación ---
                showCancelacionModal: false,
                cancelacionStep: 'buscar',   // 'buscar' | 'confirmar'
                cancelacionFolio: '',
                cancelacionVacante: null,    // vacante encontrada, si aplica para cancelar
                cancelacionError: '',        // mensaje de error/aviso a mostrar
                cancelacionMotivo: '',
                cancelacionLoading: false
            };

            function aplicarTema() {
                document.body.classList.toggle('light-theme', state.theme === 'light');
            }

            window.toggleTheme = function() {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('vacantes_theme', state.theme);
                aplicarTema();
                render();
            };

            // Trae los catálogos (Puestos, Motivo, Prioridad) desde la hoja CATALOGOS.
            async function cargarCatalogos() {
                try {
                    const res = await fetch(NOTIF_APPS_SCRIPT_URL + '?accion=obtener_catalogos');
                    const data = await res.json();
                    state.catalogos = {
                        puestos: data.puestos || [],
                        motivos: data.motivos || [],
                        prioridades: data.prioridades || [],
                        gerentes: data.gerentes || [],
                        motivosReapertura: data.motivosReapertura || []   // columna "MOTIVO REAPERTURA" de la hoja CATALOGOS
                    };
                } catch (err) {
                    console.error('Error al cargar catálogos:', err);
                }
            }

            // Busca sucursales por NOMBRE (columna "Sucursal") en la hoja BD TIENDAS.
            // Puede regresar varios resultados si hay más de una sucursal con el mismo
            // nombre (mismo nombre, distinto ID/dirección/ciudad), para que el usuario
            // elija la exacta.
            let tiendaMatchesActuales = [];
            async function buscarTiendasPorNombre(nombreSucursal) {
                try {
                    const res = await fetch(NOTIF_APPS_SCRIPT_URL + '?accion=buscar_tiendas_por_nombre&sucursal=' + encodeURIComponent(nombreSucursal));
                    const data = await res.json();
                    return (data && data.encontrada && Array.isArray(data.resultados)) ? data.resultados : [];
                } catch (err) {
                    console.error('Error al buscar sucursales por nombre:', err);
                    return [];
                }
            }

            // Valida usuario/contraseña contra la hoja "Usuarios" en el Google Sheet.
            // El backend (Code.gs) debe exponer la acción 'validar_login' que busque
            // el usuario en esa hoja y regrese { ok: true, nombre: '...' } o { ok: false }.
            async function validarLogin(usuario, password) {
                const res = await fetch(NOTIF_APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ accion: 'validar_login', usuario, password })
                });
                return res.json();
            }

            window.cerrarSesion = function() {
                state.currentUser = null;
                localStorage.removeItem('vacantes_currentUser');
                render();
            };

            const estatusOptions = ['VIGENTE', 'CANCELADA', 'CUBIERTA', 'PAUSADO', 'FORMALIZADO', 'NEGOCIACION ALIADO EXTERNO', 'REGULARIZACION', 'VIGENTE-REAPERTURADO', 'FORMALIZADO POR AP-POR REAPERTURA'];

            function getPrioridadColor(prioridad) {
                const colors = { 'Alta': 'bg-red-100 text-red-800', 'Media': 'bg-yellow-100 text-yellow-800', 'Baja': 'bg-green-100 text-green-800' };
                return colors[prioridad] || 'bg-gray-100 text-gray-800';
            }

            function getEstatusColor(estatus) {
                const isLight = state.theme === 'light';
                const colorsDark = {
                    'VIGENTE': 'bg-blue-500 text-white', 'CANCELADA': 'bg-red-500 text-white', 'CUBIERTA': 'bg-gray-500 text-white',
                    'PAUSADO': 'bg-yellow-500 text-white', 'FORMALIZADO': 'bg-green-500 text-white', 'NEGOCIACION ALIADO EXTERNO': 'bg-purple-500 text-white',
                    'REGULARIZACION': 'bg-orange-500 text-white', 'VIGENTE-REAPERTURADO': 'bg-cyan-500 text-white', 'FORMALIZADO POR AP-POR REAPERTURA': 'bg-pink-500 text-white'
                };
                const colorsLight = {
                    'VIGENTE': 'bg-blue-100 text-blue-800', 'CANCELADA': 'bg-red-100 text-red-800', 'CUBIERTA': 'bg-gray-200 text-gray-700',
                    'PAUSADO': 'bg-yellow-100 text-yellow-800', 'FORMALIZADO': 'bg-green-100 text-green-800', 'NEGOCIACION ALIADO EXTERNO': 'bg-purple-100 text-purple-800',
                    'REGULARIZACION': 'bg-orange-100 text-orange-800', 'VIGENTE-REAPERTURADO': 'bg-cyan-100 text-cyan-800', 'FORMALIZADO POR AP-POR REAPERTURA': 'bg-pink-100 text-pink-800'
                };
                const colors = isLight ? colorsLight : colorsDark;
                return colors[estatus] || (isLight ? 'bg-gray-100 text-gray-600' : 'bg-gray-400 text-white');
            }

            // Convierte una fecha 'YYYY-MM-DD' a formato corto 'DD/MM/YY' para mostrar en tabla.
            function fechaCorta(fechaISO) {
                if (!fechaISO) return '';
                // Se queda solo con la parte de fecha (YYYY-MM-DD), descartando
                // cualquier hora/timezone que venga pegada (ej. "2026-07-07T06:00:00.000Z").
                const soloFecha = String(fechaISO).split('T')[0];
                const partes = soloFecha.split('-');
                if (partes.length !== 3) return soloFecha;
                const [anio, mes, dia] = partes;
                return `${dia}/${mes}/${anio.slice(2)}`;
            }

            // Lista de gerencias (Gerente Operativo/Director) únicas, tomadas de las
            // vacantes ya cargadas, para llenar el filtro de Gerencia.
            function getGerenciasUnicas() {
                const set = new Set(state.vacancies.map(v => v.gerenteDirector).filter(Boolean));
                return Array.from(set).sort((a, b) => a.localeCompare(b, 'es'));
            }

            // Aplica únicamente los filtros de búsqueda + selects (sin el filtro de tarjeta),
            // para que los contadores de las tarjetas se mantengan estables sin importar
            // cuál tarjeta esté activa.
            function getFilteredVacanciesBase() {
                return state.vacancies.filter(v => {
                    const match = v.gerenteDirector.toLowerCase().includes(state.searchTerm.toLowerCase()) || v.cliente.toLowerCase().includes(state.searchTerm.toLowerCase());
                    const matchE = state.filterEstatusVacante === 'Todos' || v.estatusVacante === state.filterEstatusVacante;
                    const matchP = state.filterPrioridad === 'Todas' || v.prioridad === state.filterPrioridad;
                    const matchG = state.filterGerencia === 'Todas' || v.gerenteDirector === state.filterGerencia;
                    return match && matchE && matchP && matchG;
                });
            }

            // Estatus que se consideran "Reapertura" para el conteo/filtro de la tarjeta.
            const ESTATUS_DE_REAPERTURA = ['VIGENTE-REAPERTURADO', 'FORMALIZADO POR AP-POR REAPERTURA'];

            // Aplica, sobre una lista ya filtrada por búsqueda/selects, el filtro
            // adicional de la tarjeta de estadística seleccionada (state.filterCard).
            function aplicarFiltroTarjeta(lista) {
                switch (state.filterCard) {
                    case 'activas': return lista.filter(v => v.estado === 'Activo');
                    case 'prioridadAlta': return lista.filter(v => v.prioridad === 'Alta');
                    case 'cubiertas': return lista.filter(v => v.estatusVacante === 'CUBIERTA');
                    case 'reaperturas': return lista.filter(v => ESTATUS_DE_REAPERTURA.includes(v.estatusVacante));
                    case 'canceladas': return lista.filter(v => v.estatusVacante === 'CANCELADA');
                    case 'vencidas': {
                        const idsVencidas = new Set(state.vencidas.map(x => x.id));
                        return lista.filter(v => idsVencidas.has(v.id));
                    }
                    default: return lista;
                }
            }

            function getFilteredVacancies() {
                return aplicarFiltroTarjeta(getFilteredVacanciesBase());
            }

            // Click en una tarjeta de estadística: si ya estaba activa, la desactiva
            // (vuelve a 'total'); si no, la activa y filtra la tabla.
            window.filtrarPorTarjeta = function(tarjeta) {
                state.filterCard = (state.filterCard === tarjeta) ? 'total' : tarjeta;
                render();
            };

            // Exporta únicamente la tabla de vacantes (respetando búsqueda/filtros activos) a un archivo .xlsx
            window.exportarExcel = function() {
                const fv = getFilteredVacancies();
                if (!fv.length) {
                    alert('No hay vacantes para exportar.');
                    return;
                }
                const filas = fv.map(v => ({
                    'FOLIO': v.id,
                    'VACANTE': v.vacante || '',
                    'GERENTE OPERATIVO/DIRECTOR': v.gerenteDirector,
                    'ID TIENDA': v.idTienda,
                    'ESTADO': v.estado,
                    'CIUDAD': v.ciudad,
                    'CLIENTE': v.cliente,
                    'PROYECTO': v.proyecto || 'N/A',
                    'FORMATO': v.formato,
                    'SUCURSAL': v.sucursal,
                    'DIRECCIÓN DE TIENDA': v.direccionTienda || '',
                    'FECHA DE SOLICITUD': fechaCorta(v.fechaSolicitud),
                    'FECHA DE VENCIMIENTO': fechaCorta(v.fechaVencimiento),
                    'PRIORIDAD': v.prioridad,
                    'ESTATUS VACANTE': v.estatusVacante,
                    'DÍAS EN PROCESO': calcularDiasProceso(v) !== null ? calcularDiasProceso(v) : '',
                    'MOTIVO DE LA VACANTE': v.motivoVacante || '',
                    'OBSERVACIONES ADICIONALES': v.requerimiento
                }));
                const ws = XLSX.utils.json_to_sheet(filas);
                ws['!cols'] = Object.keys(filas[0]).map(k => ({ wch: Math.max(k.length, 14) }));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Vacantes');
                const fecha = new Date().toISOString().slice(0, 10);
                XLSX.writeFile(wb, `Vacantes_${fecha}.xlsx`);
            };

            // Días transcurridos desde la fecha de solicitud hasta que se cubre la vacante
            // (o hasta hoy, si aún no se cubre). El estatus lo controla el CRM2.
            function calcularDiasProceso(v) {
                if (!v.fechaSolicitud) return null;
                const soloFechaInicio = String(v.fechaSolicitud).split('T')[0];
                const inicio = new Date(soloFechaInicio + 'T00:00:00');
                const esCubierta = v.estatusVacante === 'CUBIERTA';
                const soloFechaFin = (esCubierta && v.fechaCubierta) ? String(v.fechaCubierta).split('T')[0] : null;
                const fin = soloFechaFin ? new Date(soloFechaFin + 'T00:00:00') : new Date();
                const dias = Math.max(0, Math.round((fin - inicio) / (1000 * 60 * 60 * 24)));
                return dias;
            }

            function renderDiasProceso(v) {
                const dias = calcularDiasProceso(v);
                if (dias === null) return '<span class="text-gray-500 text-xs">-</span>';
                const esCubierta = v.estatusVacante === 'CUBIERTA';
                const isLight = state.theme === 'light';
                let color;
                if (esCubierta) {
                    color = isLight ? 'bg-emerald-100 text-emerald-800' : 'bg-emerald-900 text-emerald-300';
                } else if (dias > 30) {
                    color = isLight ? 'bg-red-100 text-red-800' : 'bg-red-900 text-red-300';
                } else {
                    color = isLight ? 'bg-slate-100 text-slate-700' : 'bg-slate-800 text-slate-300';
                }
                const etiqueta = esCubierta ? `${dias} día${dias === 1 ? '' : 's'} (cubierta)` : `${dias} día${dias === 1 ? '' : 's'}`;
                return `<span class="px-2 py-1 rounded-full text-xs ${color}">${etiqueta}</span>`;
            }

            // --- Alerta de vencimiento ---
            // Solo importa para vacantes que siguen activas (VIGENTE / VIGENTE-REAPERTURADO);
            // una vez CUBIERTA, CANCELADA, etc. ya no cuenta como "vencida".
            const ESTATUS_CUENTAN_PARA_VENCIMIENTO = ['VIGENTE', 'VIGENTE-REAPERTURADO'];

            function calcularDiasVencido(v) {
                if (!v.fechaVencimiento) return null;
                if (!ESTATUS_CUENTAN_PARA_VENCIMIENTO.includes(v.estatusVacante)) return null;
                const vencimiento = new Date(String(v.fechaVencimiento).split('T')[0] + 'T00:00:00');
                if (isNaN(vencimiento.getTime())) return null;
                const hoy = new Date();
                hoy.setHours(0, 0, 0, 0);
                const dias = Math.round((hoy - vencimiento) / (1000 * 60 * 60 * 24));
                return dias > 0 ? dias : null;
            }

            // Recalcula qué vacantes activas ya están vencidas y actualiza
            // state.vencidas para que el banner las muestre. Si aparece un folio
            // vencido que no estaba antes en la lista, se reabre el banner aunque
            // el usuario lo hubiera cerrado (para que no se pierda un aviso nuevo).
            function actualizarVacantesVencidas() {
                const nuevas = state.vacancies
                    .map(v => ({ id: v.id, dias: calcularDiasVencido(v) }))
                    .filter(x => x.dias !== null)
                    .sort((a, b) => b.dias - a.dias);

                const idsAntes = new Set(state.vencidas.map(x => x.id));
                const hayFolioNuevo = nuevas.some(x => !idsAntes.has(x.id));
                if (hayFolioNuevo) state.bannerVencidasCerrado = false;

                state.vencidas = nuevas;
            }

            window.cerrarBannerVencidas = function() {
                state.bannerVencidasCerrado = true;
                render();
            };

            // ============================================================
            // ---------------------- DASHBOARD --------------------------
            // ============================================================

            window.cambiarVista = function(vista) {
                state.view = vista;
                render();
            };

            const NOMBRES_MES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

            // Convierte una clave 'YYYY-MM' en una etiqueta corta 'Ene 26'.
            function etiquetaMes(claveAnioMes) {
                const [anio, mes] = claveAnioMes.split('-');
                const idx = parseInt(mes, 10) - 1;
                return `${NOMBRES_MES[idx] || mes} ${anio.slice(2)}`;
            }

            // Agrupa vacantes por mes (YYYY-MM) según el campo de fecha indicado,
            // devolviendo un mapa { 'YYYY-MM': conteo }. Ignora vacantes sin esa fecha.
            // (Se conserva por compatibilidad; agruparPorPeriodo() es la versión general.)
            function agruparPorMes(vacantes, campoFecha) {
                return agruparPorPeriodo(vacantes, campoFecha, 'mes');
            }

            // Calcula el número de semana ISO-8601 de una fecha (lunes=inicio de semana,
            // la semana 1 es la que contiene el primer jueves del año).
            function numeroSemanaISO(anio, mes, dia) {
                const d = new Date(Date.UTC(anio, mes - 1, dia));
                const diaSemana = (d.getUTCDay() + 6) % 7; // 0 = lunes ... 6 = domingo
                d.setUTCDate(d.getUTCDate() - diaSemana + 3);
                const primerJueves = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
                const diaSemanaJueves = (primerJueves.getUTCDay() + 6) % 7;
                primerJueves.setUTCDate(primerJueves.getUTCDate() - diaSemanaJueves + 3);
                const semana = 1 + Math.round((d - primerJueves) / (7 * 24 * 60 * 60 * 1000));
                return { anio: d.getUTCFullYear(), semana };
            }

            // Devuelve la clave de agrupación de una fecha 'YYYY-MM-DD' según el
            // periodo elegido: 'semana' (ISO), 'quincena' (1-15 / 16-fin de mes) o 'mes'.
            function claveDePeriodo(soloFecha, periodo) {
                const partes = soloFecha.split('-');
                if (partes.length !== 3) return null;
                const anio = parseInt(partes[0], 10);
                const mes = parseInt(partes[1], 10);
                const dia = parseInt(partes[2], 10);
                if (periodo === 'semana') {
                    const { anio: anioIso, semana } = numeroSemanaISO(anio, mes, dia);
                    return `${anioIso}-W${String(semana).padStart(2, '0')}`;
                }
                if (periodo === 'quincena') {
                    const q = dia <= 15 ? '1' : '2';
                    return `${partes[0]}-${partes[1]}-Q${q}`;
                }
                return `${partes[0]}-${partes[1]}`; // 'mes' (default)
            }

            // Agrupa vacantes por el periodo indicado ('semana' | 'quincena' | 'mes')
            // según el campo de fecha dado, devolviendo un mapa { clave: conteo }.
            // Ignora vacantes sin esa fecha.
            function agruparPorPeriodo(vacantes, campoFecha, periodo = 'mes') {
                const mapa = {};
                vacantes.forEach(v => {
                    const f = v[campoFecha];
                    if (!f) return;
                    const soloFecha = String(f).split('T')[0];
                    const clave = claveDePeriodo(soloFecha, periodo);
                    if (!clave) return;
                    mapa[clave] = (mapa[clave] || 0) + 1;
                });
                return mapa;
            }

            // Devuelve las últimas N claves de periodo (orden ascendente) que aparezcan
            // en cualquiera de los mapas de agrupación dados, para que las tendencias
            // compartan el mismo eje de tiempo.
            function ultimosPeriodosClaves(mapas, n = 8) {
                const set = new Set();
                mapas.forEach(m => Object.keys(m).forEach(k => set.add(k)));
                return Array.from(set).sort().slice(-n);
            }

            // Compatibilidad con el nombre anterior.
            function ultimosMesesClaves(mapas, n = 8) {
                return ultimosPeriodosClaves(mapas, n);
            }

            // Etiqueta legible de una clave de periodo según su granularidad.
            function etiquetaPeriodo(clave, periodo) {
                if (periodo === 'semana') {
                    const [anio, sem] = clave.split('-W');
                    return `Sem ${sem} '${anio.slice(2)}`;
                }
                if (periodo === 'quincena') {
                    const [anio, mes, q] = clave.split('-');
                    const idx = parseInt(mes, 10) - 1;
                    const rango = q === 'Q1' ? '1-15' : '16-fin';
                    return `${rango} ${NOMBRES_MES[idx] || mes} '${anio.slice(2)}`;
                }
                return etiquetaMes(clave);
            }

            // Nombres legibles de cada opción de granularidad para el selector del dashboard.
            const NOMBRES_PERIODO = { semana: 'Semana', quincena: 'Quincena', mes: 'Mes' };

            // Normaliza el valor de un campo (ciudad, cliente, estatus, etc.) de una
            // vacante, para que el conteo de gráficas y el filtro por clic usen
            // exactamente el mismo criterio (incluyendo el caso "Sin dato").
            function valorNormalizado(v, campo) {
                const val = (v[campo] || '').toString().trim();
                return val || 'Sin dato';
            }

            // Cuenta ocurrencias de un campo (ej. ciudad, cliente, gerenteDirector)
            // y devuelve las N combinaciones más frecuentes, ordenadas descendente.
            function topPorCampo(vacantes, campo, n = 8) {
                const mapa = {};
                vacantes.forEach(v => {
                    const val = valorNormalizado(v, campo);
                    mapa[val] = (mapa[val] || 0) + 1;
                });
                return Object.entries(mapa).sort((a, b) => b[1] - a[1]).slice(0, n);
            }

            // Nombres legibles de los campos que se pueden usar como filtro cruzado
            // del dashboard (al hacer clic en una gráfica).
            const NOMBRES_CAMPO_DASHBOARD = {
                estatusVacante: 'Estatus',
                prioridad: 'Prioridad',
                ciudad: 'Ciudad',
                cliente: 'Cliente',
                gerenteDirector: 'Gerente/Director',
                sucursal: 'Tienda',
                proyecto: 'Proyecto',
                motivoReapertura: 'Motivo de Reapertura'
            };

            // Activa/desactiva el filtro cruzado del dashboard. Si ya estaba activo
            // ese mismo campo+valor (clic de nuevo sobre lo mismo), lo quita.
            window.filtrarDashboardPor = function(campo, valor) {
                const f = state.dashboardFiltro;
                state.dashboardFiltro = (f && f.campo === campo && f.valor === valor) ? null : { campo, valor };
                render();
            };

            window.quitarFiltroDashboard = function() {
                state.dashboardFiltro = null;
                render();
            };

            // Cambia la granularidad ('semana' | 'quincena' | 'mes') de las gráficas
            // de tendencia del dashboard.
            window.cambiarPeriodoDashboard = function(periodo) {
                if (!NOMBRES_PERIODO[periodo]) return;
                state.dashboardPeriodo = periodo;
                render();
            };

            // Aplica el filtro cruzado (si hay alguno activo) sobre una lista de vacantes.
            function aplicarFiltroDashboard(lista) {
                if (!state.dashboardFiltro) return lista;
                const { campo, valor } = state.dashboardFiltro;
                return lista.filter(v => valorNormalizado(v, campo) === valor);
            }

            // Promedio de días en proceso, solo de vacantes ya CUBIERTAS (tiempo real de cobertura).
            function promedioDiasCobertura(vacantes) {
                const cubiertas = vacantes.filter(v => v.estatusVacante === 'CUBIERTA');
                const dias = cubiertas.map(calcularDiasProceso).filter(d => d !== null);
                if (!dias.length) return null;
                return Math.round(dias.reduce((a, b) => a + b, 0) / dias.length);
            }

            // Paleta consistente para las gráficas (coincide con el verde/azul de marca).
            const PALETA_GRAFICAS = ['#3B82F6', '#8CC63F', '#F59E0B', '#EF4444', '#8B5CF6', '#06B6D4', '#EC4899', '#64748B'];

            function coloresTema() {
                const isLight = state.theme === 'light';
                return {
                    texto: isLight ? '#374151' : '#d1d5db',
                    rejilla: isLight ? '#e5e7eb' : '#2a2a2a'
                };
            }

            function opcionesBaseChart(extra = {}) {
                const { texto, rejilla } = coloresTema();
                return {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: texto } },
                        ...(extra.plugins || {})
                    },
                    scales: extra.scales || {
                        x: { ticks: { color: texto }, grid: { color: rejilla } },
                        y: { ticks: { color: texto }, grid: { color: rejilla }, beginAtZero: true }
                    }
                };
            }

            // Arma todo el HTML del dashboard (tarjetas de % + contenedores <canvas>).
            // Los <canvas> se llenan después, en dibujarGraficasDashboard(), una vez
            // que el HTML ya está insertado en el DOM.
            function renderDashboardHTML(vacantes) {
                const total = vacantes.length;
                const pct = (n) => total ? Math.round((n / total) * 100) : 0;
                const nCubiertas = vacantes.filter(v => v.estatusVacante === 'CUBIERTA').length;
                const nVigentes = vacantes.filter(v => ESTATUS_CUENTAN_PARA_VENCIMIENTO.includes(v.estatusVacante)).length;
                const nCanceladas = vacantes.filter(v => v.estatusVacante === 'CANCELADA').length;
                const nReaperturas = vacantes.filter(v => ESTATUS_DE_REAPERTURA.includes(v.estatusVacante)).length;
                const diasCobertura = promedioDiasCobertura(vacantes);
                const isLight = state.theme === 'light';
                const tarjeta = isLight ? 'bg-white border-gray-200' : 'bg-[#1a1a1a] border-gray-800';
                const cont = isLight ? 'bg-white border-gray-200' : 'bg-[#1a1a1a] border-gray-800';

                const kpi = (titulo, valor, sub) => `
                    <div class="${tarjeta} p-4 rounded-lg shadow-lg border">
                        <p class="text-gray-400 text-sm">${titulo}</p>
                        <p class="text-white text-3xl font-bold mt-1">${valor}</p>
                        ${sub ? `<p class="text-gray-500 text-xs mt-1">${sub}</p>` : ''}
                    </div>`;

                const f = state.dashboardFiltro;
                const botonImprimir = `
                    <div class="mb-4 flex items-center justify-between no-imprimir">
                        <span class="text-xs text-gray-500">${f ? '' : 'Tip: haz clic en una barra o segmento (estatus, prioridad, ciudad, cliente, gerente) para filtrar todo el dashboard por ese dato. Haz clic de nuevo para quitarlo.'}</span>
                        <button type="button" onclick="window.print()" class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            ${icons.download} Descargar / Imprimir PDF
                        </button>
                    </div>`;
                const badgeFiltro = f ? `
                    <div class="mb-4 flex items-center gap-2 text-sm">
                        <span class="text-gray-400">Filtro activo:</span>
                        <span class="px-3 py-1 rounded-full bg-blue-600 text-white flex items-center gap-2">
                            ${NOMBRES_CAMPO_DASHBOARD[f.campo] || f.campo}: ${f.valor}
                            <button type="button" onclick="quitarFiltroDashboard()" class="hover:text-gray-200 no-imprimir" title="Quitar filtro">${icons.x.replace('width="24"', 'width="14"').replace('height="24"', 'height="14"')}</button>
                        </span>
                    </div>
                ` : '';

                const periodoActual = state.dashboardPeriodo || 'mes';
                const selectorPeriodo = `
                    <div class="flex items-center gap-2 no-imprimir">
                        <span class="text-gray-400 text-sm">Ver tendencia por:</span>
                        <div class="flex rounded-lg overflow-hidden border ${isLight ? 'border-gray-300' : 'border-gray-700'}">
                            ${Object.keys(NOMBRES_PERIODO).map(p => `
                                <button type="button" onclick="cambiarPeriodoDashboard('${p}')"
                                    class="px-3 py-1.5 text-sm transition-colors ${p === periodoActual
                                        ? 'bg-blue-600 text-white'
                                        : (isLight ? 'bg-white text-gray-600 hover:bg-gray-100' : 'bg-[#1a1a1a] text-gray-300 hover:bg-[#252525]')}">
                                    ${NOMBRES_PERIODO[p]}
                                </button>
                            `).join('')}
                        </div>
                    </div>`;

                return `
                    ${botonImprimir}
                    ${badgeFiltro}
                    <div id="avisoChartCdn" class="hidden mb-4 rounded-lg border p-3 text-sm no-imprimir ${isLight ? 'bg-amber-50 border-amber-300 text-amber-800' : 'bg-amber-950/40 border-amber-800 text-amber-300'}">
                        No se pudieron cargar las gráficas (la librería Chart.js no se descargó). Verifica tu conexión a internet o si tu red bloquea cdn.jsdelivr.net; los porcentajes de arriba sí son correctos aunque las gráficas no se dibujen.
                    </div>

            // Dibuja las gráficas de Chart.js dentro de los <canvas> ya insertados
            // en el DOM. Debe llamarse después de document.getElementById('app').innerHTML = ...
            // Formatter genérico de etiquetas "N (P%)" para un dataset de un solo
            // grupo (doughnut o barra de una sola serie), usando el total de ese
            // mismo dataset como base del porcentaje.
            function formatterConteoPct(value, ctx) {
                if (!value) return '';
                const total = (ctx.dataset.data || []).reduce((a, b) => a + b, 0);
                const pct = total ? Math.round((value / total) * 100) : 0;
                return `${value} (${pct}%)`;
            }

            // Config compartida del plugin datalabels para gráficas de dona/barra:
            // texto blanco con contorno oscuro para que se lea sobre cualquier color.
            const DATALABELS_CONTEO = {
                display: true,
                color: '#fff',
                font: { weight: 'bold', size: 11 },
                textStrokeColor: 'rgba(0,0,0,0.65)',
                textStrokeWidth: 3,
                formatter: formatterConteoPct
            };

            // Maneja el clic sobre un elemento (barra/segmento) de una gráfica
            // categórica y activa/desactiva el filtro cruzado del dashboard.
            function alHacerClicEnGrafica(campo) {
                return function(event, elements, chart) {
                    if (!elements.length) return;
                    const idx = elements[0].index;
                    const valor = chart.data.labels[idx];
                    filtrarDashboardPor(campo, valor);
                };
            }

            function dibujarGraficasDashboard(vacantes) {
                destruirGraficasDashboard();
                const avisoCdn = document.getElementById('avisoChartCdn');
                if (typeof Chart === 'undefined') {
                    // La librería de gráficas no cargó (sin internet o el CDN está bloqueado).
                    if (avisoCdn) avisoCdn.classList.remove('hidden');
                    return;
                }
                if (avisoCdn) avisoCdn.classList.add('hidden');
                if (typeof ChartDataLabels !== 'undefined') Chart.register(ChartDataLabels);

                // --- Tendencia (semana / quincena / mes, según selector del dashboard) ---
                const periodo = state.dashboardPeriodo || 'mes';
                const porPeriodoNuevas = agruparPorPeriodo(vacantes, 'fechaSolicitud', periodo);
                const porPeriodoCubiertas = agruparPorPeriodo(vacantes.filter(v => v.estatusVacante === 'CUBIERTA'), 'fechaCubierta', periodo);
                const porPeriodoCanceladas = agruparPorPeriodo(vacantes.filter(v => v.estatusVacante === 'CANCELADA'), 'fechaSolicitud', periodo);
                const clavesPeriodos = ultimosPeriodosClaves([porPeriodoNuevas, porPeriodoCubiertas, porPeriodoCanceladas], periodo === 'semana' ? 12 : 8);
                const ctxTendencia = document.getElementById('chartTendencia');
                if (ctxTendencia && clavesPeriodos.length) {
                    const dlTendencia = (color) => ({
                        display: true, color, font: { weight: 'bold', size: 10 }, align: 'top', anchor: 'end',
                        backgroundColor: 'rgba(0,0,0,0.55)', borderRadius: 4, padding: 3,
                        formatter: v => (v ? v : '')
                    });
                    dashboardCharts.tendencia = new Chart(ctxTendencia, {
                        type: 'line',
                        data: {
                            labels: clavesPeriodos.map(k => etiquetaPeriodo(k, periodo)),
                            datasets: [
                                { label: 'Nuevas', data: clavesPeriodos.map(k => porPeriodoNuevas[k] || 0), borderColor: PALETA_GRAFICAS[0], backgroundColor: PALETA_GRAFICAS[0] + '33', tension: 0.3, fill: true, datalabels: dlTendencia(PALETA_GRAFICAS[0]) },
                                { label: 'Cubiertas', data: clavesPeriodos.map(k => porPeriodoCubiertas[k] || 0), borderColor: PALETA_GRAFICAS[1], backgroundColor: PALETA_GRAFICAS[1] + '33', tension: 0.3, fill: true, datalabels: dlTendencia(PALETA_GRAFICAS[1]) },
                                { label: 'Canceladas', data: clavesPeriodos.map(k => porPeriodoCanceladas[k] || 0), borderColor: PALETA_GRAFICAS[3], backgroundColor: PALETA_GRAFICAS[3] + '33', tension: 0.3, fill: true, datalabels: dlTendencia(PALETA_GRAFICAS[3]) }
                            ]
                        },
                        options: opcionesBaseChart()
                        // Nota: la tendencia es por periodo de tiempo, no por categoría, así
                        // que no tiene filtro por clic (no hay un solo "valor" que filtrar).
                    });
                }

                // --- Distribución por estatus ---
                const porEstatus = topPorCampo(vacantes, 'estatusVacante', 12);
                const ctxEstatus = document.getElementById('chartEstatus');
                if (ctxEstatus && porEstatus.length) {
                    dashboardCharts.estatus = new Chart(ctxEstatus, {
                        type: 'doughnut',
                        data: {
                            labels: porEstatus.map(x => x[0]),
                            datasets: [{ data: porEstatus.map(x => x[1]), backgroundColor: PALETA_GRAFICAS, datalabels: DATALABELS_CONTEO }]
                        },
                        options: { ...opcionesBaseChart({ scales: {} }), onClick: alHacerClicEnGrafica('estatusVacante'), onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; } }
                    });
                }

                // --- Distribución por prioridad ---
                const porPrioridad = topPorCampo(vacantes, 'prioridad', 5);

                if (ctxPrioridad && porPrioridad.length) {

                        type: 'doughnut',

                        },
                        options: { ...opcionesBaseChart({ scales: {} }), onClick: alHacerClicEnGrafica('prioridad'), onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; } }
                    });
                }

                // --- Por ciudad ---
                const porCiudad = topPorCampo(vacantes, 'ciudad', 8);
                const ctxCiudad = document.getElementById('chartCiudad');
                if (ctxCiudad && porCiudad.length) {
                    dashboardCharts.ciudad = new Chart(ctxCiudad, {
                        type: 'bar',
                        data: { labels: porCiudad.map(x => x[0]), datasets: [{ label: 'Vacantes', data: porCiudad.map(x => x[1]), backgroundColor: PALETA_GRAFICAS[0], datalabels: DATALABELS_CONTEO }] },
                        options: { ...opcionesBaseChart(), indexAxis: 'y', plugins: { legend: { display: false } }, onClick: alHacerClicEnGrafica('ciudad'), onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; } }
                    });
                }

                // --- Por cliente ---
                const porCliente = topPorCampo(vacantes, 'cliente', 8);
                const ctxCliente = document.getElementById('chartCliente');
                if (ctxCliente && porCliente.length) {
                    dashboardCharts.cliente = new Chart(ctxCliente, {
                        type: 'bar',
                        data: { labels: porCliente.map(x => x[0]), datasets: [{ label: 'Vacantes', data: porCliente.map(x => x[1]), backgroundColor: PALETA_GRAFICAS[1], datalabels: DATALABELS_CONTEO }] },
                        options: { ...opcionesBaseChart(), indexAxis: 'y', plugins: { legend: { display: false } }, onClick: alHacerClicEnGrafica('cliente'), onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; } }
                    });
                }

                // --- Por tienda/sucursal ---
                const porTienda = topPorCampo(vacantes, 'sucursal', 8);
                const ctxTienda = document.getElementById('chartTienda');
                if (ctxTienda && porTienda.length) {
                    dashboardCharts.tienda = new Chart(ctxTienda, {
                        type: 'bar',
                        data: { labels: porTienda.map(x => x[0]), datasets: [{ label: 'Vacantes', data: porTienda.map(x => x[1]), backgroundColor: PALETA_GRAFICAS[4], datalabels: DATALABELS_CONTEO }] },
                        options: { ...opcionesBaseChart(), indexAxis: 'y', plugins: { legend: { display: false } }, onClick: alHacerClicEnGrafica('sucursal'), onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; } }
                    });
                }

                // --- Por formato ---
                const porFormato = topPorCampo(vacantes, 'formato', 8);
                const ctxFormato = document.getElementById('chartFormato');
                if (ctxFormato && porFormato.length) {
                    dashboardCharts.formato = new Chart(ctxFormato, {
                        type: 'bar',
                        data: { labels: porFormato.map(x => x[0]), datasets: [{ label: 'Vacantes', data: porFormato.map(x => x[1]), backgroundColor: PALETA_GRAFICAS[5], datalabels: DATALABELS_CONTEO }] },
                        options: { ...opcionesBaseChart(), indexAxis: 'y', plugins: { legend: { display: false } }, onClick: alHacerClicEnGrafica('formato'), onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; } }
                    });
                }

                // --- Por gerente/director ---
                const porGerente = topPorCampo(vacantes, 'gerenteDirector', 8);
                const ctxGerente = document.getElementById('chartGerente');
                if (ctxGerente && porGerente.length) {
                    dashboardCharts.gerente = new Chart(ctxGerente, {
                        type: 'bar',
                        data: { labels: porGerente.map(x => x[0]), datasets: [{ label: 'Vacantes', data: porGerente.map(x => x[1]), backgroundColor: PALETA_GRAFICAS[2], datalabels: DATALABELS_CONTEO }] },
                        options: { ...opcionesBaseChart(), indexAxis: 'y', plugins: { legend: { display: false } }, onClick: alHacerClicEnGrafica('gerenteDirector'), onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; } }
                    });
                }

                // --- Motivo de Reapertura (solo vacantes en estatus de reapertura) ---
                // Incluye categorías como "No se presentó" tal como vengan del catálogo
                // "MOTIVO REAPERTURA" de la hoja CATALOGOS.
                const vacantesReabiertas = vacantes.filter(v => ESTATUS_DE_REAPERTURA.includes(v.estatusVacante));
                const porMotivoReapertura = topPorCampo(vacantesReabiertas, 'motivoReapertura', 10);
                const ctxMotivoReapertura = document.getElementById('chartMotivoReapertura');
                if (ctxMotivoReapertura && porMotivoReapertura.length) {
                    dashboardCharts.motivoReapertura = new Chart(ctxMotivoReapertura, {
                        type: 'bar',
                        data: { labels: porMotivoReapertura.map(x => x[0]), datasets: [{ label: 'Reaperturas', data: porMotivoReapertura.map(x => x[1]), backgroundColor: PALETA_GRAFICAS[6], datalabels: DATALABELS_CONTEO }] },
                        options: { ...opcionesBaseChart(), indexAxis: 'y', plugins: { legend: { display: false } }, onClick: alHacerClicEnGrafica('motivoReapertura'), onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; } }
                    });
                }
            }

            // Normaliza un registro proveniente del Google Sheet (columnas en PascalCase)
            // al formato interno usado por la vista.
            function normalizarVacanteDesdeSheet(row) {
                return {
                    id: String(row.ID || ''),
                    requerimiento: row['Observaciones Adicionales'] || '',
                    vacante: row.Vacante || '',
                    gerenteDirector: row.GerenteDirector || '',
                    idTienda: row.IdTienda || '',
                    estado: row.Estado || 'Activo',
                    ciudad: row.Ciudad || '',
                    cliente: row.Cliente || '',
                    proyecto: row.Proyecto || '',
                    motivoVacante: row.MotivoVacante || '',
                    formato: row.Formato || '',
                    sucursal: row.Sucursal || '',
                    direccionTienda: row.DireccionTienda || '',
                    fechaSolicitud: row.FechaSolicitud || '',
                    fechaVencimiento: row.FechaVencimiento || '',
                    prioridad: row.Prioridad || 'Media',
                    estatusVacante: row.EstatusVacante || 'VIGENTE',
                    fechaCubierta: row.FechaCubierta || '',
                    usuarioCarga: row.UsuarioCarga || '',
                    nombreCarga: row.NombreCarga || '',
                    // Motivo capturado al reabrir la vacante (catálogo "MOTIVO REAPERTURA"),
                    // incluye valores como "No se presentó". Se lee de la hoja si el backend
                    // ya lo está guardando en una columna con alguno de estos nombres.
                    motivoReapertura: row.MotivoReapertura || row['Motivo Reapertura'] || row.MotivoDeReapertura || ''
                };
            }

            // El estatus de cada vacante lo controla el CRM2: aquí solo lo leemos
            // desde el mismo Google Sheet para mantenerlo sincronizado.
            async function cargarVacantesDesdeSheet() {
                try {
                    const res = await fetch(NOTIF_APPS_SCRIPT_URL + '?accion=obtener_vacantes');
                    const data = await res.json();
                    if (Array.isArray(data) && data.length) {
                        state.vacancies = data.map(normalizarVacanteDesdeSheet);
                        actualizarVacantesVencidas();
                        // No repintar la pantalla si el usuario tiene el formulario de
                        // Nueva Vacante abierto: se perdería lo que está escribiendo.
                        // Los datos ya quedaron actualizados en el estado, y se verán
                        // en cuanto cierre el modal o vuelva a renderizar.
                        if (!state.showNewVacancyModal) {
                            render();
                        }
                    }
                } catch (err) {
                    console.error('Error al cargar vacantes desde Google Sheets:', err);
                }
            }

            // --- Flujo de Reapertura ---

            window.abrirReapertura = function() {
                state.showReaperturaModal = true;
                state.reaperturaStep = 'buscar';
                state.reaperturaFolio = '';
                state.reaperturaVacante = null;
                state.reaperturaError = '';
                state.reaperturaMotivoCategoria = '';
                state.reaperturaMotivo = '';
                state.reaperturaLoading = false;
                render();
            };

            window.cerrarReapertura = function() {
                state.showReaperturaModal = false;
                render();
            };

            // Vuelve a la pantalla de búsqueda de folio (por si el usuario se
            // equivocó o quiere intentar con otro folio).
            window.reintentarReapertura = function() {
                state.reaperturaStep = 'buscar';
                state.reaperturaVacante = null;
                state.reaperturaError = '';
                state.reaperturaMotivoCategoria = '';
                state.reaperturaMotivo = '';
                render();
            };

            // Busca el folio dentro de las vacantes ya cargadas (state.vacancies) y
            // valida si su estatus permite reapertura (CUBIERTA o FORMALIZADO).
            window.buscarFolioReapertura = function() {
                const input = document.getElementById('reaperturaFolioInput');
                const folio = (input ? input.value : '').trim();
                state.reaperturaFolio = folio;

                if (!folio) {
                    state.reaperturaError = 'Escribe un folio para buscar.';
                    render();
                    return;
                }

                const encontrada = state.vacancies.find(v => String(v.id).trim().toUpperCase() === folio.toUpperCase());

                if (!encontrada) {
                    state.reaperturaVacante = null;
                    state.reaperturaError = `No se encontró ninguna vacante con el folio "${folio}".`;
                    render();
                    return;
                }

                const estatusActual = (encontrada.estatusVacante || '').toUpperCase();
                if (!ESTATUS_REAPERTURABLES.includes(estatusActual)) {
                    state.reaperturaVacante = null;
                    state.reaperturaError = `La vacante ${encontrada.id} no se puede reabrir. Su estatus actual es "${encontrada.estatusVacante}". Solo se pueden reabrir vacantes en estatus CUBIERTA o FORMALIZADO.`;
                    render();
                    return;
                }

                state.reaperturaVacante = encontrada;
                state.reaperturaError = '';
                state.reaperturaStep = 'confirmar';
                render();
            };

            // Envía la reapertura al backend: cambia el estatus y guarda el motivo.
            window.confirmarReapertura = async function() {
                const selectCategoria = document.getElementById('reaperturaMotivoCategoriaInput');
                const textarea = document.getElementById('reaperturaMotivoInput');
                const motivoCategoria = (selectCategoria ? selectCategoria.value : '').trim();
                const detalle = (textarea ? textarea.value : '').trim();

                if (!motivoCategoria) {
                    state.reaperturaError = 'Selecciona el Motivo de Reapertura.';
                    render();
                    return;
                }

                const v = state.reaperturaVacante;
                state.reaperturaLoading = true;
                state.reaperturaError = '';
                render();

                // IMPORTANTE: la ventana de WhatsApp se abre AQUÍ, de forma síncrona,
                // todavía dentro del clic del usuario. Si se abriera después del
                // "await" de abajo, el navegador la bloquea como pop-up sin avisar
                // (así se comportaba antes: el WhatsApp "no mandaba" nada). Se abre
                // en blanco con un mensaje de espera y se redirige a wa.me solo si
                // el backend confirma la reapertura; si no, se cierra sola.
                const ventanaWhats = window.open('', '_blank');
                if (ventanaWhats) {
                    ventanaWhats.document.write('Confirmando reapertura, un momento...');
                }

                try {
                    const resultado = await reabrirVacanteEnSheet(v.id, motivoCategoria, detalle);
                    if (resultado && resultado.ok) {
                        state.showReaperturaModal = false;
                        state.reaperturaLoading = false;
                        render();
                        if (ventanaWhats && !ventanaWhats.closed) {
                            ventanaWhats.location.href = `https://wa.me/?text=${encodeURIComponent(armarMensajeReapertura(v, motivoCategoria, detalle))}`;
                        } else {
                            // El navegador bloqueó incluso la ventana en blanco (poco
                            // común, pero puede pasar); se intenta el método directo
                            // como último recurso, aunque también podría bloquearse.
                            enviarWhatsAppReapertura(v, motivoCategoria, detalle);
                        }
                        alert(`Vacante ${v.id} reabierta correctamente.`);
                        cargarVacantesDesdeSheet();
                    } else {
                        if (ventanaWhats && !ventanaWhats.closed) ventanaWhats.close();
                        state.reaperturaLoading = false;
                        state.reaperturaError = (resultado && resultado.mensaje) ||
                            'No se pudo reabrir la vacante. Es posible que su estatus haya cambiado; vuelve a buscar el folio.';
                        render();
                    }
                } catch (err) {
                    console.error('Error al reabrir la vacante:', err);
                    if (ventanaWhats && !ventanaWhats.closed) ventanaWhats.close();
                    state.reaperturaLoading = false;
                    state.reaperturaError = 'Error de conexión al reabrir la vacante. Intenta de nuevo.';
                    render();
                }
            };

            // --- Flujo de Cancelación ---
            window.abrirCancelacion = function() {
                state.showCancelacionModal = true;
                state.cancelacionStep = 'buscar';
                state.cancelacionFolio = '';
                state.cancelacionVacante = null;
                state.cancelacionError = '';
                state.cancelacionMotivo = '';
                state.cancelacionLoading = false;
                render();
            };

            window.cerrarCancelacion = function() {
                state.showCancelacionModal = false;
                render();
            };

            // Vuelve a la pantalla de búsqueda de folio (por si el usuario se
            // equivocó o quiere intentar con otro folio).
            window.reintentarCancelacion = function() {
                state.cancelacionStep = 'buscar';
                state.cancelacionVacante = null;
                state.cancelacionError = '';
                state.cancelacionMotivo = '';
                render();
            };

            // Busca el folio dentro de las vacantes ya cargadas (state.vacancies)
            // y valida que su estatus permita cancelarla (que no esté ya CANCELADA).
            window.buscarFolioCancelacion = function() {
                const input = document.getElementById('cancelacionFolioInput');
                const folio = (input ? input.value : '').trim();
                state.cancelacionFolio = folio;

                if (!folio) {
                    state.cancelacionError = 'Escribe un folio para buscar.';
                    render();
                    return;
                }

                const encontrada = state.vacancies.find(v => String(v.id).trim().toUpperCase() === folio.toUpperCase());
                if (!encontrada) {
                    state.cancelacionVacante = null;
                    state.cancelacionError = `No se encontró ninguna vacante con el folio "${folio}".`;
                    render();
                    return;
                }

                const estatusActual = (encontrada.estatusVacante || '').trim().toUpperCase();
                if (!ESTATUS_CANCELABLES.includes(estatusActual)) {
                    state.cancelacionVacante = null;

            window.confirmarCancelacion = async function() {
                const textarea = document.getElementById('cancelacionMotivoInput');

                    state.cancelacionError = 'Escribe el motivo de la cancelación.';

                state.cancelacionLoading = true;

                // síncrona, todavía dentro del clic del usuario. Si se abriera
                // después del "await" de abajo, el navegador la bloquea como
                // pop-up sin avisar. Se abre en blanco con un mensaje de espera
                // y se redirige a wa.me solo si el backend confirma la
                // cancelación; si no, se cierra sola.
                const ventanaWhats = window.open('', '_blank');
                if (ventanaWhats) {
                    ventanaWhats.document.write('Confirmando cancelación, un momento...');

                            // método directo como último recurso, aunque también
                            // podría bloquearse.
                            enviarWhatsAppCancelacion(v, motivo);

                    state.cancelacionError = 'Error de conexión al cancelar la vacante. Intenta de nuevo.';

            // Fondo animado de puntos flotando (verde corporativo) para la pantalla de login.
            // El loop se detiene solo cuando el canvas ya no existe en el DOM (login superado).
            let _loginParticlesRAF = null;
            function iniciarParticulasLogin() {
                const canvas = document.getElementById('loginParticles');
                if (!canvas) return;
                if (_loginParticlesRAF) cancelAnimationFrame(_loginParticlesRAF);
                const ctx = canvas.getContext('2d');
                let w, h;
                function resize() {
                    w = canvas.width = canvas.offsetWidth;
                    h = canvas.height = canvas.offsetHeight;
                }
                resize();
                window.addEventListener('resize', resize);

                const cantidad = Math.max(20, Math.min(60, Math.floor((w * h) / 16000)));
                const puntos = Array.from({ length: cantidad }, () => ({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: (Math.random() - 0.5) * 0.25,
                    r: Math.random() * 1.6 + 0.8
                }));

                function frame() {
                    if (!document.getElementById('loginParticles')) { _loginParticlesRAF = null; return; }
                    ctx.clearRect(0, 0, w, h);
                    puntos.forEach(p => {
                        p.x += p.vx; p.y += p.vy;
                        if (p.x <= 0 || p.x >= w) p.vx *= -1;
                        if (p.y <= 0 || p.y >= h) p.vy *= -1;
                    });
                    for (let i = 0; i < puntos.length; i++) {
                        for (let j = i + 1; j < puntos.length; j++) {
                            const dx = puntos[i].x - puntos[j].x, dy = puntos[i].y - puntos[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 110) {
                                ctx.strokeStyle = `rgba(140, 198, 63, ${0.14 * (1 - dist / 110)})`;
                                ctx.lineWidth = 1;
                                ctx.beginPath();
                                ctx.moveTo(puntos[i].x, puntos[i].y);
                                ctx.lineTo(puntos[j].x, puntos[j].y);
                                ctx.stroke();
                            }
                        }
                    }
                    puntos.forEach(p => {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(140, 198, 63, 0.6)';
                        ctx.fill();
                    });
                    _loginParticlesRAF = requestAnimationFrame(frame);
                }

                            gerenteDirector: fd.get('gerenteDirector'),
                            idTienda: fd.get('idTienda'),
                            estado: fd.get('estado'),
                            ciudad: fd.get('ciudad'),
                            cliente: fd.get('cliente'),
                            proyecto: fd.get('proyecto'),
                            motivoVacante: fd.get('motivoVacante'),
                            formato: fd.get('formato'),
                            sucursal: fd.get('sucursal'),
                            direccionTienda: fd.get('direccionTienda'),
                            fechaSolicitud: fd.get('fechaSolicitud'),
                            fechaVencimiento: fd.get('fechaVencimiento'),
                            prioridad: fd.get('prioridad'),
                            estatusVacante: 'VIGENTE',
                            fechaCubierta: '',
                            usuarioCarga: state.currentUser ? state.currentUser.usuario : '',
                            nombreCarga: state.currentUser ? state.currentUser.nombre : ''
                        };
                        state.vacancies.push(nv);
                        state.showNewVacancyModal = false;
                        render();

                        // Al cargar una vacante nueva: enviar por WhatsApp y notificar al CRM2
                        enviarWhatsAppVacante(nv);
                        notificarCRM2Vacante(nv);

                        // Refrescar desde el Sheet para tomar el ID/registro definitivo
                        setTimeout(cargarVacantesDesdeSheet, 1500);
                    });
                }
            }

            // Restaura la sesión guardada (si existe) para que, al recargar la página,
            // no se vuelva a pedir el login hasta que el usuario cierre sesión.
            (function restaurarSesion() {
                try {
                    const guardado = localStorage.getItem('vacantes_currentUser');
                    if (guardado) {
                        state.currentUser = JSON.parse(guardado);
                    }
                } catch (err) {
                    console.error('Error al restaurar la sesión:', err);
                    localStorage.removeItem('vacantes_currentUser');
                }
            })();

            render();

            if (state.currentUser) {
                cargarVacantesDesdeSheet();
                cargarCatalogos();
            }

            setInterval(() => { if (state.currentUser) cargarVacantesDesdeSheet(); }, 30000);
        </script>
    </body>
    </html>
